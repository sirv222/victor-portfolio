{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password updated</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✍️</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'blog.css' %}" />
</head>
<body>
  <header class="navbar">
    <nav class="nav-inner">
      <a href="{% url 'blog' %}" class="logo">Ink<span>&amp; Insight</span></a>
      <ul class="nav-links">
        <li><a href="{% url 'blog' %}">Home</a></li>
        <li><a href="{% url 'login' %}">Login</a></li>
      </ul>
      <div class="nav-actions">
        <button class="theme-toggle" aria-label="Toggle theme">🌙</button>
      </div>
    </nav>
  </header>

  {% if messages %}
  <div id="django-messages" hidden>
    {% for message in messages %}
    <div data-message="{{ message|escape }}" data-tags="{{ message.tags }}"></div>
    {% endfor %}
  </div>
  {% endif %}

  <main class="container auth-shell">
    <section class="form-panel reveal">
      <div class="section-tag">DONE</div>
      <h1>Password updated</h1>
      <p class="muted">Your password has been changed successfully. You can now sign in with your new credentials.</p>
      <p class="muted" style="margin-top: 20px;"><a href="{% url 'login' %}">Go to login</a></p>
    </section>
  </main>

  <script src="{% static 'blog.js' %}"></script>
</body>
</html>
